<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b0c" />
<title>HoosierSDR</title>
<style>
  :root {
    --bg:#080b0c; --panel:#0d1213; --panel2:#10181a; --line:#1e2a2b;
    --ink:#d9e8e5; --dim:#839491; --faint:#7d8f8c; --signal:#34e0cf;
    --clear:#5fd39a; --amber:#f5b544; --enc:#e97387;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, "SF Pro Text", system-ui, sans-serif;
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  .brand { font-weight:700; font-size:20px; letter-spacing:.02em; }
  .brand b { color:var(--signal); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; }
  .card h1 { font-size:17px; margin:0 0 6px; }
  .card p { color:var(--dim); margin:0 0 14px; font-size:14px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:12px 0 4px; }
  input {
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px; font-size:16px;
  }
  input:focus { border-color:var(--signal); outline:none; }
  button {
    width:100%; margin-top:16px; background:var(--signal); color:#05100e; border:0;
    border-radius:10px; padding:13px; font-size:16px; font-weight:600; cursor:pointer;
  }
  button:active { opacity:.85; }
  .err { color:var(--enc); font-size:14px; margin-top:10px; min-height:20px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--dim); font-size:14px; }
  .row .v { font-weight:600; font-size:15px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); margin-right:6px; }
  .dot.live { background:var(--signal); box-shadow:0 0 8px var(--signal); }
  .muted { color:var(--faint); font-size:13px; text-align:center; padding:30px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Hoosier<b>SDR</b></div>

    <!-- login -->
    <div class="card" id="login">
      <h1>Connect to your radio</h1>
      <p>Enter the access token shown in the app's terminal (or in its secrets file).</p>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…" />
      <button id="go">Connect</button>
      <div class="err" id="loginErr"></div>
    </div>

    <!-- dashboard (placeholder) -->
    <div id="dash" hidden>
      <div class="card">
        <h1>Status</h1>
        <div class="row"><span class="k"><span class="dot" id="dot"></span>Receiver</span><span class="v" id="run">—</span></div>
        <div class="row"><span class="k">Talkgroups loaded</span><span class="v" id="cat">—</span></div>
        <div class="row"><span class="k">Server time</span><span class="v" id="time">—</span></div>
      </div>
      <p class="muted">More coming: live calls, audio, and full control.</p>
      <button id="logout" style="background:var(--panel2);color:var(--dim);border:1px solid var(--line)">Forget token</button>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = "hs.web.token";
  const token = () => localStorage.getItem(TOKEN_KEY) || "";
  const authHeaders = () => ({ "X-Token": token() });

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
    if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  function showLogin() { $("login").hidden = false; $("dash").hidden = true; }
  function showDash()  { $("login").hidden = true;  $("dash").hidden = false; }

  $("go").onclick = async () => {
    const t = $("token").value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    try {
      const s = await api("/api/status");
      $("loginErr").textContent = "";
      showDash(); renderStatus(s);
    } catch (e) {
      localStorage.removeItem(TOKEN_KEY);
      $("loginErr").textContent = e.message === "unauthorized" ? "Wrong token." : String(e.message);
    }
  };

  $("logout").onclick = () => { localStorage.removeItem(TOKEN_KEY); showLogin(); };

  function renderStatus(s) {
    $("run").textContent = s.running ? "running" : "standby";
    $("dot").className = "dot" + (s.running ? " live" : "");
    $("cat").textContent = s.catalog_len;
    $("time").textContent = new Date(s.server_time * 1000).toLocaleTimeString();
  }

  // already have a token? go straight to the dashboard.
  (async () => {
    if (!token()) { showLogin(); return; }
    try { const s = await api("/api/status"); showDash(); renderStatus(s); }
    catch { /* stays on login */ }
  })();
</script>
</body>
</html>
