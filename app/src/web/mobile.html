<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b0c" />
<title>HoosierSDR</title>
<style>
  :root {
    --bg:#080b0c; --panel:#0d1213; --panel2:#10181a; --line:#1e2a2b;
    --ink:#d9e8e5; --dim:#839491; --faint:#7d8f8c; --signal:#34e0cf;
    --clear:#5fd39a; --amber:#f5b544; --enc:#e97387;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, "SF Pro Text", system-ui, sans-serif;
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  .brand { font-weight:700; font-size:20px; letter-spacing:.02em; }
  .brand b { color:var(--signal); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:16px; }
  .card h1 { font-size:15px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:600; }
  .card p { color:var(--dim); margin:0 0 14px; font-size:14px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:12px 0 4px; }
  input {
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:12px; font-size:16px;
  }
  input:focus { border-color:var(--signal); outline:none; }
  button {
    width:100%; margin-top:16px; background:var(--signal); color:#05100e; border:0;
    border-radius:10px; padding:13px; font-size:16px; font-weight:600; cursor:pointer;
  }
  button.ghost { background:var(--panel2); color:var(--dim); border:1px solid var(--line); }
  button:active { opacity:.85; }
  .err { color:var(--enc); font-size:14px; margin-top:10px; min-height:20px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--dim); font-size:14px; }
  .row .v { font-weight:600; font-size:15px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); margin-right:6px; }
  .dot.live { background:var(--signal); box-shadow:0 0 8px var(--signal); }
  .muted { color:var(--faint); font-size:13px; text-align:center; padding:30px 0; }
  [hidden] { display:none !important; }
  /* live feed */
  #feed { max-height:60vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .entry { padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .entry:last-child { border-bottom:0; }
  .entry .t { color:var(--faint); font-size:11px; margin-bottom:2px; }
  .entry .body { color:var(--ink); }
  .entry .body b { color:var(--signal); }
  .entry.call .body b { color:var(--clear); }
  .entry.notice .body { color:var(--dim); }
  .entry.audio .body { color:var(--amber); }
  .pill { display:inline-flex; gap:8px; }
  .pill button { width:auto; margin:0; padding:8px 14px; font-size:13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Hoosier<b>SDR</b></div>

    <!-- login -->
    <div class="card" id="login">
      <h1>Connect to your radio</h1>
      <p>Enter the access token shown in the app's terminal (or in its secrets file).</p>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…" />
      <button id="go">Connect</button>
      <div class="err" id="loginErr"></div>
    </div>

    <!-- dashboard -->
    <div id="dash" hidden>
      <div class="card">
        <h1>Status</h1>
        <div class="row"><span class="k"><span class="dot" id="dot"></span>Receiver</span><span class="v" id="run">—</span></div>
        <div class="row"><span class="k">Talkgroups loaded</span><span class="v" id="cat">—</span></div>
        <div class="pill">
          <button class="ghost" id="audioBtn">Enable audio</button>
          <button class="ghost" id="logout">Forget token</button>
        </div>
      </div>

      <div class="card">
        <h1>Live feed</h1>
        <div id="feed"><p class="muted">Waiting for activity…</p></div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = "hs.web.token";
  const token = () => localStorage.getItem(TOKEN_KEY) || "";
  const authHeaders = () => ({ "X-Token": token() });

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
    if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }
  async function command(name, args = {}) {
    return api("/api/command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command: name, args }) });
  }

  // tg → alias map from the saved catalogs.
  let nameMap = {};
  async function loadNames() {
    try { nameMap = Object.fromEntries((await command("catalog_rows")).map(r => [r.id, r.alias])); }
    catch { nameMap = {}; }
  }
  const nameOf = (tg, fallback) => nameMap[tg] || fallback || ("TG " + tg);

  function showLogin() { $("login").hidden = false; $("dash").hidden = true; es?.close(); }
  function showDash()  { $("login").hidden = true;  $("dash").hidden = false; }

  $("go").onclick = async () => {
    const t = $("token").value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    try {
      const s = await api("/api/status");
      $("loginErr").textContent = "";
      await loadNames();
      showDash(); renderStatus(s); connect();
    } catch (e) {
      localStorage.removeItem(TOKEN_KEY);
      $("loginErr").textContent = e.message === "unauthorized" ? "Wrong token." : String(e.message);
    }
  };
  $("logout").onclick = () => { localStorage.removeItem(TOKEN_KEY); showLogin(); };

  function renderStatus(s) {
    $("run").textContent = s.running ? "running" : "standby";
    $("dot").className = "dot" + (s.running ? " live" : "");
    $("cat").textContent = s.catalog_len;
  }

  // ---- live feed ----
  const feed = $("feed");
  let first = true;
  function addEntry(cls, time, html) {
    if (first) { feed.innerHTML = ""; first = false; }
    const div = document.createElement("div");
    div.className = "entry " + cls;
    const t = document.createElement("div");
    t.className = "t"; t.textContent = time;
    const b = document.createElement("div");
    b.className = "body"; b.innerHTML = html;
    div.append(t, b);
    feed.prepend(div);
    while (feed.children.length > 200) feed.lastChild.remove();
  }
  const now = () => new Date().toLocaleTimeString();

  function onFollow(d) {
    switch (d.kind) {
      case "call_start":
        addEntry("call", now(), `<b>${nameOf(d.tg, d.name)}</b> — call started @ ${d.freq_mhz.toFixed(4)} MHz`);
        break;
      case "grant":
        addEntry("", now(), `grant: <b>${nameOf(d.tg, d.name)}</b> @ ${d.freq_mhz.toFixed(4)} MHz${d.encrypted ? " 🔒" : ""}`);
        break;
      case "call":
        addEntry("call", now(), `<b>${nameOf(d.tg, d.name)}</b> — ${d.secs.toFixed(0)}s${d.emergency ? " 🚨" : ""}${d.encrypted ? " 🔒" : ""}`);
        break;
      case "notice":
        addEntry("notice", now(), d.text);
        break;
      case "measured":
        addEntry("notice", now(), `control ${d.control_mhz.toFixed(4)} MHz (${d.modulation})`);
        break;
      case "status":
        $("run").textContent = "running";
        $("dot").className = "dot live";
        break;
      default: break; // high-frequency / uninteresting kinds ignored
    }
  }

  // ---- audio ----
  let ac = null;
  function ensureAudio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  }
  $("audioBtn").onclick = () => { ensureAudio(); $("audioBtn").textContent = "Audio on ✓"; };
  function playPcm(tg, b64) {
    if (!ac) return; // audio not enabled yet
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const pcm = new Int16Array(bytes.buffer);
    const buf = ac.createBuffer(1, pcm.length, 8000);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(ac.destination);
    src.start();
    addEntry("audio", now(), `▶ <b>${nameOf(tg)}</b> (${(pcm.length / 8000).toFixed(0)}s)`);
  }

  // ---- SSE ----
  let es = null;
  function connect() {
    es = new EventSource("/api/events?token=" + encodeURIComponent(token()));
    es.addEventListener("follow", e => onFollow(JSON.parse(e.data)));
    es.addEventListener("audio", e => playPcm(JSON.parse(e.data).tg, JSON.parse(e.data).pcm_b64));
    es.addEventListener("stopped", () => renderStatus({ running: false, catalog_len: +$("cat").textContent }));
    es.addEventListener("error", () => { /* transient; EventSource auto-reconnects */ });
    es.onerror = () => { /* auto-reconnect */ };
  }

  // already have a token? go straight to the dashboard.
  (async () => {
    if (!token()) { showLogin(); return; }
    try { const s = await api("/api/status"); await loadNames(); showDash(); renderStatus(s); connect(); }
    catch { /* stays on login */ }
  })();
</script>
</body>
</html>
