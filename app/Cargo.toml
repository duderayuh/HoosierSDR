[package]
name = "hoosier-sdr-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HoosierSDR desktop app (Tauri v2)"

# Own workspace: keep this out of the core Cargo workspace so `cargo build
# --workspace` and CI (which run on Linux without WebKit) never try to build
# the Tauri layer. Build this app separately on macOS/Windows.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hs-core = { path = "../crates/hs-core" }
hs-source = { path = "../crates/hs-source", features = ["rtlsdr", "airspy"] }
hs-catalog = { path = "../crates/hs-catalog", features = ["radioreference"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
cpal = "0.15"

# `cargo tauri dev` builds the dev profile. Unoptimized, the decode stack is
# ~50x too slow for a 10 MSPS site follow — the UI starved and showed nothing,
# which read as "the app doesn't work". Optimize dev builds; debug assertions
# stay on.
[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
