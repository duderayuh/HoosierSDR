name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Decode-quality gate: the synthetic benchmark must run clean every PR.
      # Once the field-IQ corpus exists this step also reports metric deltas
      # (corpus fetched from external storage, never committed).
      - run: cargo run -p hs-bench
